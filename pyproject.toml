[project]
name = "growtrics-challenge"
version = "0.1.0"
description = "Demo backend: AI chemistry video request service"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "boto3>=1.35",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.9",
    "httpx>=0.27",
    "import-linter>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
line-length = 100
target-version = "py314"
# Python in the design docs is an illustrative sketch, not code. Formatting it rewrites prose.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
# `tests/support/` is builders and backend wiring, imported by the contract suite and by the
# memory-double tests. It is on the path explicitly rather than through pytest's per-directory
# sys.path insertion, because that only reaches a sibling of the module being collected and
# these two callers are in different directories.
pythonpath = ["tests"]

# The import graph is the architecture (D065). A rule that is not checked is a comment.
[tool.importlinter]
root_package = "app"
include_external_packages = true # domain is forbidden third-party imports, not only local ones

[[tool.importlinter.contracts]]
name = "domain imports nothing"
type = "forbidden"
source_modules = ["app.domain"]
forbidden_modules = [
    "app.api",
    "app.orchestration",
    "app.intake",
    "app.custody",
    "app.generation",
    "app.access",
    "app.observability",
    "app.storage",
    "fastapi",
    "sqlalchemy",
    "boto3",
]

[[tool.importlinter.contracts]]
name = "api reaches no adapter"
type = "forbidden"
source_modules = ["app.api"]
forbidden_modules = ["app.generation", "app.storage"]

[[tool.importlinter.contracts]]
name = "orchestration imports ports, not adapters"
type = "forbidden"
source_modules = ["app.orchestration"]
forbidden_modules = ["app.api", "app.storage"]

# One package speaks each protocol. A module that imports a driver has reached around its port,
# and the query it then writes is a database call nobody can find. `app.storage.sql` and
# `app.storage.objects` are absent from the sources below because they are the exceptions.
# tests/unit/storage/sql_discipline_test.py says the same thing and also names every statement.
[[tool.importlinter.contracts]]
name = "postgres is spoken in one package"
type = "forbidden"
source_modules = [
    "app.api",
    "app.domain",
    "app.orchestration",
    "app.intake",
    "app.custody",
    "app.generation",
    "app.access",
    "app.observability",
    "app.storage.memory",
    "app.storage.objects",
    "app.config",
    "app.main",
    "app.worker",
]
forbidden_modules = ["psycopg", "sqlalchemy"]

[[tool.importlinter.contracts]]
name = "object storage is spoken in one package"
type = "forbidden"
source_modules = [
    "app.api",
    "app.domain",
    "app.orchestration",
    "app.intake",
    "app.custody",
    "app.generation",
    "app.access",
    "app.observability",
    "app.storage.memory",
    "app.storage.sql",
    "app.config",
    "app.main",
    "app.worker",
]
forbidden_modules = ["boto3"]

